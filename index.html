<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具集 — 发票归档 &amp; 检测报告生成</title>
<style>
  :root {
    --bg: #f5f3f0;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --text-secondary: #6b6b6b;
    --border: #e8e4df;
    --accent1: #c0392b;
    --accent1-light: #fdf2f2;
    --accent2: #1a5276;
    --accent2-light: #eaf2f8;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
    --shadow-hover: 0 2px 8px rgba(0,0,0,0.08), 0 8px 32px rgba(0,0,0,0.06);
    --radius: 16px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-serif: "Noto Serif SC", "Source Han Serif SC", "SimSun", "宋体", serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --card-bg: #2a2a2a;
      --text: #e8e8e8;
      --text-secondary: #a0a0a0;
      --border: #3a3a3a;
      --accent1-light: #3a1a1a;
      --accent2-light: #1a2a3a;
      --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.2);
      --shadow-hover: 0 2px 8px rgba(0,0,0,0.4), 0 8px 32px rgba(0,0,0,0.3);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    line-height: 1.6;
  }

  .container {
    width: 100%;
    max-width: 780px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .header {
    text-align: center;
    padding: 0 16px;
  }
  .header h1 {
    font-family: var(--font-serif);
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
    color: var(--text);
  }
  .header p {
    color: var(--text-secondary);
    font-size: 0.95rem;
    letter-spacing: 0.02em;
  }
  .header .divider {
    width: 48px;
    height: 3px;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    margin: 16px auto 0;
    border-radius: 2px;
  }

  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  @media (max-width: 640px) {
    .cards { grid-template-columns: 1fr; }
    .header h1 { font-size: 1.5rem; }
    .container { gap: 24px; }
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 16px;
    transition: box-shadow 0.2s ease, transform 0.2s ease;
    cursor: default;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .card.invoice::before { background: var(--accent1); }
  .card.report::before { background: var(--accent2); }

  .card-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    flex-shrink: 0;
  }
  .card.invoice .card-icon {
    background: var(--accent1-light);
    color: var(--accent1);
  }
  .card.report .card-icon {
    background: var(--accent2-light);
    color: var(--accent2);
  }

  .card h2 {
    font-family: var(--font-serif);
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .card p {
    color: var(--text-secondary);
    font-size: 0.88rem;
    line-height: 1.65;
    flex: 1;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag {
    font-size: 0.75rem;
    padding: 3px 10px;
    border-radius: 99px;
    font-weight: 500;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .card.invoice .tag {
    background: var(--accent1-light);
    color: var(--accent1);
  }
  .card.report .tag {
    background: var(--accent2-light);
    color: var(--accent2);
  }

  .card-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    letter-spacing: 0.03em;
    transition: all 0.15s ease;
    align-self: flex-start;
    cursor: pointer;
    border: none;
  }
  .card.invoice .card-btn {
    background: var(--accent1);
    color: #fff;
  }
  .card.invoice .card-btn:hover {
    background: #a93226;
  }
  .card.report .card-btn {
    background: var(--accent2);
    color: #fff;
  }
  .card.report .card-btn:hover {
    background: #154360;
  }
  .card-btn svg {
    width: 16px; height: 16px;
    transition: transform 0.15s ease;
  }
  .card-btn:hover svg {
    transform: translateX(2px);
  }

  .footer {
    text-align: center;
    color: var(--text-secondary);
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    padding: 8px 0;
  }
</style>
</head>
<body>
<div class="container">

  <header class="header">
    <h1>工 具 集</h1>
    <p>咸阳亨通电力检修有限公司 · 专业工具平台</p>
    <div class="divider"></div>
  </header>

  <div class="cards">

    <div class="card invoice">
      <div class="card-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="18" rx="2"/>
          <line x1="6" y1="8" x2="10" y2="8"/>
          <line x1="6" y1="12" x2="14" y2="12"/>
          <line x1="6" y1="16" x2="18" y2="16"/>
          <circle cx="19" cy="8" r="2"/>
        </svg>
      </div>
      <h2>票据归档台</h2>
      <p>将多张 PDF 发票智能合并为一页两联或独占页，支持火车票自动识别、二维码金额提取、滴滴/高德行程单解析。</p>
      <div class="card-tags">
        <span class="tag">PDF 合并</span>
        <span class="tag">发票识别</span>
        <span class="tag">火车票</span>
        <span class="tag">行程单</span>
      </div>
      <a href="./invoice-merger/" class="card-btn">
        进入工具
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </div>

    <div class="card report">
      <div class="card-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
      </div>
      <h2>检测报告生成</h2>
      <p>架空线双端局放检测报告自动生成系统。导入 Excel 数据，一键生成含封面、目录、图谱、结论的完整 Word 报告。</p>
      <div class="card-tags">
        <span class="tag">报告生成</span>
        <span class="tag">局放检测</span>
        <span class="tag">Excel 导入</span>
        <span class="tag">Word 导出</span>
      </div>
      <a href="./report-generator/" class="card-btn">
        进入工具
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </div>

  </div>

  <footer class="footer">
    Build 1.0 · 2026-08-10 · GitHub Pages
  </footer>

</div>
</body>
</html>
