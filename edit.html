<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑报告 · KPD-800T 检测报告系统</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="assets/img/logo.png" type="image/png">
</head>
<body>
  <div id="noise"></div>
  <div class="app">

    <!-- 顶部 AppBar -->
    <header class="appbar">
      <div class="brand">
        <div class="brand-mark">E</div>
        <div class="brand-text">
          <span class="brand-title">KPD-800T · 报告编辑</span>
          <span class="brand-sub">在线修改 · 同步缩略图 · Word 导出</span>
        </div>
      </div>
      <div class="appbar-meta">
        <a href="index.html" class="btn btn-ghost" id="btnBackHome">← 返回主页</a>
        <span class="dot"></span><span id="saveStatus">编辑后自动保存</span>
        <span class="pill cyan" id="editPill">实时同步</span>
      </div>
    </header>

    <div class="edit-layout">

      <!-- 左侧缩略图导航 -->
      <aside class="glass aside">
        <h3>章节导航</h3>
        <div class="aside-meta">
          点击缩略图快速跳转到对应章节。当前页高亮。
        </div>
        <div class="thumb-grid" id="thumbGrid">
          <!-- 由 JS 注入 -->
        </div>
      </aside>

      <!-- 右侧可编辑报告 -->
      <div class="col" style="gap:14px;">
        <section class="glass" style="padding:14px 20px;">
          <div class="card-head" style="margin-bottom:0;">
            <div class="card-title">
              <span class="idx">✎</span>
              <div>
                <div>可编辑报告</div>
                <div class="card-sub">点击任意段落直接修改 · 内容变更自动保存到当前会话</div>
              </div>
            </div>
            <div class="btn-row">
              <button class="btn btn-primary" id="btnDownloadWord">⬇ 下载 Word</button>
              <button class="btn btn-ghost" id="btnPrintPdf">🖨 打印 PDF</button>
              <button class="btn btn-ghost" id="btnResetEdit">↺ 还原示例</button>
            </div>
          </div>
        </section>

        <section class="glass report-card">
          <div class="report-frame" style="padding:32px 44px; max-height: none;" contenteditable="true" id="editorFrame">
            <!-- 由 KPDA.buildReportHtml() 注入 -->
          </div>
        </section>
      </div>

    </div>

  </div>

  <script src="assets/js/xlsx.full.min.js"></script>
  <script src="assets/js/docx.iife.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/docx-gen.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!window.KPDA) { alert("共享脚本加载失败"); return; }
      const $ = id => document.getElementById(id);

      // 读取状态（优先 sessionStorage，回退到示例数据）
      let loaded = KPDA.loadReport();
      if (loaded && loaded.defects && loaded.defects.length) {
        KPDA.state.info = Object.assign(KPDA.infoDefault(), loaded.info || {});
        KPDA.state.defects = loaded.defects;
        KPDA.state.defectRows = (loaded.defects || []).map(d => d.display || {});
      } else {
        KPDA.initDemo();
      }

      // 渲染编辑报告
      const editor = $("editorFrame");
      function renderEditor() {
        const html = KPDA.buildReportHtml(KPDA.state.info, KPDA.state.defects);
        editor.innerHTML = html;
        KPDA.saveEditedHtml(html);
        renderThumbs();
      }

      // 缩略图 + 点击跳转
      const thumbGrid = $("thumbGrid");
      let activeSection = "sec-cover";

      function renderThumbs() {
        const sections = KPDA.getReportSections(KPDA.state.info, KPDA.state.defects);
        thumbGrid.innerHTML = sections.map(s => `
          <div class="thumb" data-target="${s.id}">
            <div class="thumb-title"><span class="num">${escape(s.num)}</span><span>${escape(s.title)}</span></div>
            <div class="thumb-sub">${escape(s.sub || "")}</div>
            <div class="thumb-preview">${escape(s.title)} · 跳转 →</div>
          </div>
        `).join("");

        thumbGrid.querySelectorAll(".thumb").forEach(t => {
          t.onclick = () => {
            const target = t.getAttribute("data-target");
            const el = editor.querySelector("#" + target);
            if (el) {
              el.scrollIntoView({ behavior: "smooth", block: "start" });
              activeSection = target;
              updateActive();
              // 高亮闪烁
              el.classList.remove("flash");
              void el.offsetWidth; // reflow
              el.classList.add("flash");
            }
          };
        });
        updateActive();
      }

      function updateActive() {
        thumbGrid.querySelectorAll(".thumb").forEach(t => {
          t.classList.toggle("is-active", t.getAttribute("data-target") === activeSection);
        });
      }

      // 监听 scroll 自动激活
      editor.addEventListener("scroll", () => {
        const sections = KPDA.getReportSections(KPDA.state.info, KPDA.state.defects);
        const edRect = editor.getBoundingClientRect();
        let cur = sections[0].id;
        for (const s of sections) {
          const el = editor.querySelector("#" + s.id);
          if (!el) continue;
          const r = el.getBoundingClientRect();
          if (r.top - edRect.top < 100) cur = s.id;
        }
        if (cur !== activeSection) { activeSection = cur; updateActive(); }
      });

      // 编辑变更自动保存
      let saveTimer = null;
      editor.addEventListener("input", () => {
        if (saveTimer) clearTimeout(saveTimer);
        $("saveStatus").textContent = "正在保存…";
        saveTimer = setTimeout(() => {
          KPDA.saveEditedHtml(editor.innerHTML);
          $("saveStatus").textContent = "✓ 已保存 · " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
        }, 400);
      });

      // 下载 Word
      $("btnDownloadWord").onclick = async () => {
        // 用户编辑过的 HTML 优先 — 直接从 editor.innerHTML 取出文本，逐条写回 state.info/defects
        // 这里使用简化方式：同步编辑 HTML 至 sessionStorage，然后直接生成（按 state 数据）
        // 若要深度还原编辑内容到 docx，需要专门解析 HTML → 章节字段，这是后续增强项
        KPDA.saveEditedHtml(editor.innerHTML);
        const old = $("btnDownloadWord").innerHTML;
        $("btnDownloadWord").innerHTML = `<span class="loading"></span><span>生成中…</span>`;
        $("btnDownloadWord").disabled = true;
        try {
          await KPDA.downloadWord("架空线双端局放检测报告.docx");
          $("saveStatus").textContent = "✓ Word 已生成";
        } catch (e) {
          alert("Word 生成失败：" + (e.message || e));
        } finally {
          $("btnDownloadWord").innerHTML = old;
          $("btnDownloadWord").disabled = false;
        }
      };

      // 打印 PDF
      $("btnPrintPdf").onclick = () => {
        const w = window.open("", "_blank");
        w.document.write(`<html><head><meta charset="utf-8"><title>检测报告</title>
          <style>
            body { font-family: "Microsoft YaHei", "PingFang SC", serif; color:#1e293b; padding:24px; }
            .report-cover { text-align:center; padding:32px 24px; border-bottom:2px solid #1d4ed8; margin-bottom:28px; }
            .report-cover .banner { display:inline-block; background:#1d4ed8; color:#fff; font-size:22px; font-weight:700; letter-spacing:0.6em; padding:14px 28px; border-radius:6px; margin:14px 0; }
            .report-cover .org { display:flex; justify-content:space-between; font-size:13px; color:#475569; margin-top:12px; }
            .report-h { font-size:16px; font-weight:700; color:#1e3a8a; margin:22px 0 12px; }
            .report-h2 { font-size:14px; font-weight:700; color:#1e3a8a; margin:14px 0 8px; }
            .report-toc { border:1px solid #cbd5e1; border-radius:6px; padding:14px 18px; margin:12px 0 24px; }
            .report-toc .toc-line { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed #cbd5e1; }
            .report-toc .toc-num { width:80px; color:#1e3a8a; font-weight:600; }
            table.report-table { width:100%; border-collapse:collapse; margin:12px 0; font-size:12.5px; }
            table.report-table th, table.report-table td { border:1px solid #94a3b8; padding:6px 10px; vertical-align:middle; }
            table.report-table th { background:#eff6ff; font-weight:600; color:#1e3a8a; width:22%; }
            table.report-table td { background:#fff; text-align:left; }
            .report-blue-bar { background:#1d4ed8; color:#fff; font-weight:700; text-align:center; padding:10px; margin:18px 0 12px; border-radius:4px; }
            .report-blue-bar.sub { font-size:13px; padding:8px; }
            .report-img-ph { display:flex; flex-direction:column; align-items:center; justify-content:center; background:repeating-linear-gradient(45deg,#eff6ff,#eff6ff 8px,#dbeafe 8px,#dbeafe 16px); border:1px dashed #93c5fd; color:#2563eb; border-radius:6px; height:180px; margin:10px 0; padding:12px; }
            .report-para { margin:10px 0; text-indent:2em; }
            .report-end { margin-top:28px; padding-top:14px; border-top:1px solid #cbd5e1; font-size:11.5px; color:#64748b; }
          </style></head><body>${editor.innerHTML}</body></html>`);
        w.document.close();
        setTimeout(() => w.print(), 300);
      };

      // 还原示例
      $("btnResetEdit").onclick = () => {
        if (!confirm("将当前编辑内容还原为默认示例数据，确认？")) return;
        KPDA.initDemo();
        renderEditor();
        $("saveStatus").textContent = "✓ 已还原为示例";
      };

      // 工具
      function escape(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
        );
      }

      // 启动
      renderEditor();
      $("saveStatus").textContent = "就绪 · " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
    });
  </script>
</body>
</html>
